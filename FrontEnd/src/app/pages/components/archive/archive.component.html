<p-card header="Archives">
  <p-tabView>
    <p-tabPanel header="Produits">
      <p-table [value]="articlesArchives">
        <ng-template pTemplate="header">
          <tr>
            <th>Référence</th>
            <th>Description</th>
            <th>Prix</th>
            <th>Stock</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-article>
          <tr>
            <td>{{ article.reference }}</td>
            <td>{{ article.description }}</td>
            <td>{{ article.prixVente }} €</td>
            <td>{{ article.stock }}</td>
          </tr>
        </ng-template>
      </p-table>
    </p-tabPanel>

    <p-tabPanel header="Fournisseurs">
      <p-table [value]="fournisseursArchives">
        <ng-template pTemplate="header">
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Téléphone</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-fournisseur>
          <tr>
            <td>{{ fournisseur.nom }}</td>
            <td>{{ fournisseur.email }}</td>
            <td>{{ fournisseur.telephone }}</td>
          </tr>
        </ng-template>
      </p-table>
    </p-tabPanel>

    <p-tabPanel header="Commandes">
      <p-table [value]="commandesArchives">
        <!-- structure des colonnes pour les commandes -->
      </p-table>
    </p-tabPanel>

    <p-tabPanel header="Facturation">
      <p-table [value]="facturesArchives">
        <!-- structure des colonnes pour les factures -->
      </p-table>
    </p-tabPanel>
  </p-tabView>
</p-card>
